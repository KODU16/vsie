plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.140'
}

def configureModSubprojects(String modName) {
    configure(subprojects.findAll { it.path.startsWith(":${modName}:") }) {
        def modProps = new Properties()
        file("${rootProject.projectDir}/${modName}/gradle.properties").withInputStream { modProps.load(it) }

        modProps.each { key, value ->
            project.ext.set(key.toString(), value)
        }

        version = project.mod_version
        group = modProps.group
        description = modProps.description
    }
}

configureModSubprojects('vsie')

version = mod_version
group = mod_group_id
/*jarJar.enable()
reobf {
    jarJar { }
}

tasks.jarJar.finalizedBy('reobfJarJar')*/

base {
    // Function: keep the public artifact name independent from the internal mod ID.
    archivesName = mod_archive_name
}

tasks.named('jar', Jar).configure {
    // Function: make the release artifact path and filename explicit for IDEA and Gradle builds.
    archiveFileName.set("${mod_archive_name}-${mod_version}.jar")
    destinationDirectory.set(layout.buildDirectory.dir('libs'))
    // Function: refresh the distributable JAR even when IDEA considers compilation inputs unchanged.
    outputs.upToDateWhen { false }
    doLast {
        logger.lifecycle("AeroIE release artifact: ${archiveFile.get().asFile}")
    }
}

tasks.named('classes').configure {
    // Function: IDEA delegates Build Project to classes, so package the distributable JAR afterward.
    finalizedBy(tasks.named('jar'))
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)
println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

neoForge {
    version = neo_version

    parchment {
        minecraftVersion = minecraft_version
        mappingsVersion = mapping_version
    }

    runs {
        client {
            client()
            gameDirectory = project.file('run')
        }

        server {
            server()
            gameDirectory = project.file('run-server')
        }

        data {
            data()
            gameDirectory = project.file('run-data')
            programArguments.addAll('--mod', mod_id, '--all', '--output', file('src/generated/resources/').toString(), '--existing', file('src/main/resources/').toString())
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
        }
    }

    mods {
        register(mod_id) {
            sourceSet sourceSets.main
        }
    }
}

sourceSets.main.resources { srcDirs = ['src/main/resources', 'src/generated/resources'] }

repositories {
