// Guards definition-driven weapon fields, firepoint ownership and independent multi-beam hit paths.
var verifyCustomTurretWeapons = tasks.register("verifyCustomTurretWeapons") {
    group = "verification"
    description = "Checks custom turret weapon definitions and runtime firepoint behavior."

    doLast {
        var definition = file("src/main/java/com/kodu16/vsie/content/aeroie_custom/CustomDeviceDefinition.java").text
        var editor = file("src/main/java/com/kodu16/vsie/content/aeroie_custom/client/CustomDeviceEditorScreen.java").text
        var runtime = file("src/main/java/com/kodu16/vsie/content/aeroie_custom/CustomTurretBlockEntity.java").text
        var renderer = file("src/main/java/com/kodu16/vsie/content/aeroie_custom/client/CustomDeviceMeshRenderer.java").text
        var packet = file("src/main/java/com/kodu16/vsie/network/turret/TurretFirePointC2SPacket.java").text
        if (!definition.contains('public int firepointCount = 1')
                || !definition.contains('Bone.child("firepoint1", "long_cannon")')
                || !definition.contains('public float rotationSpeedDegreesPerTick')
                || !definition.contains('public String weaponType = "energy"')
                || !definition.contains('validateFirepoints(byId)')
                || !editor.contains('"long_cannon".equals(selectedBone().id)')
                || !editor.contains('firepoint_prefix_reserved')
                || !runtime.contains('for (int index = 1; index <= definition.firepointCount; index++)')
                || !runtime.contains('BeamImpact impact = traceBeam')
                || !runtime.contains('impact.entity.hurt')
                || !runtime.contains('tickPendingProjectileVolley()')
                || !renderer.contains('CustomTurretBeamRenderer.render')
                || !packet.contains('firepointIndex')) {
            throw new GradleException("Custom turret firepoint and weapon behavior contract regressed")
        }
    }
}

tasks.named("check") {
    dependsOn verifyCustomTurretWeapons
}

