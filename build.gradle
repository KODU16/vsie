    doLast {
        var modelSource = file("src/main/java/com/kodu16/vsie/content/controlseat/client/AbstractControlSeatModel.java").text
        var fallbackSource = file("src/main/java/com/kodu16/vsie/content/aeroie_custom/CustomDeviceGeoModel.java").text
        var textureDirectory = file("src/main/resources/assets/vsie/textures/block/control_seat")
        var expectedTextures = [
                "gray_white_light_blue.png",
                "blue_black_white.png",
                "brown_orange_black.png",
                "gray_black_white.png"
        ]
        if (!modelSource.contains("textures/block/control_seat/gray_white_light_blue.png")
                || !fallbackSource.contains("textures/block/control_seat/gray_white_light_blue.png")
                || expectedTextures.any { !new File(textureDirectory, it).isFile() }
                || file("src/main/resources/assets/vsie/textures/block/control_seat.png").exists()) {
            throw new GradleException("Control-seat texture folder or active palette contract regressed")
        }
    }
}

tasks.named("check") {
    dependsOn verifyControlSeatTextures
}

// Guards startup-critical classes against partially compiled release artifacts.
var verifyRuntimeJarContents = tasks.register("verifyRuntimeJarContents") {
    group = "verification"
    description = "Checks that the release JAR contains classes referenced during early Mixin startup."
    dependsOn tasks.named("jar")

    doLast {
        var artifact = tasks.named("jar", Jar).get().archiveFile.get().asFile
        var javaRoot = file("src/main/java")
        var requiredEntries = fileTree(javaRoot) {
            include "**/*.java"
            exclude "**/package-info.java", "**/module-info.java"
        }.files.collect { source ->
            javaRoot.toPath().relativize(source.toPath()).toString()
                    .replace('\\', '/')
                    .replaceFirst(/\.java$/, '.class')
        }
        var archive = new java.util.zip.ZipFile(artifact)
        try {
            var missingEntries = requiredEntries.findAll { archive.getEntry(it) == null }
            if (!missingEntries.isEmpty()) {
                throw new GradleException("Release JAR is missing startup-critical classes: ${missingEntries.join(', ')}")
            }
        } finally {
            archive.close()
        }
    }
}

tasks.named("check") {
    dependsOn verifyRuntimeJarContents
}

// Restores the user-facing update log after Gradle clean removes the build directory.
var syncUpdateLog = tasks.register("syncUpdateLog", Copy) {
    from(layout.projectDirectory.file("update_log.txt"))
    into(layout.buildDirectory.dir("libs"))
}

tasks.named("clean") {
    finalizedBy syncUpdateLog
}

tasks.named("build") {
    finalizedBy syncUpdateLog
}

// Compile only the dependency-free math seam, avoiding Minecraft startup and every jar task.
tasks.register("verifyDeepSpaceHudMath") {
    group = "verification"
    description = "Checks planet model ray selection and surface-distance calculations."
    doLast {
        def outputDir = layout.buildDirectory.dir("deepspace-hud-contract").get().asFile
        delete(outputDir)
        outputDir.mkdirs()
        exec {
            commandLine "${System.getProperty('java.home')}/bin/javac",
                    "-d", outputDir,
                    file("src/main/java/com/kodu16/vsie/integration/deepspace/DeepSpaceHudMath.java"),
                    file("src/contract/java/com/kodu16/vsie/integration/deepspace/DeepSpaceHudMathContract.java")
        }
        exec {
            commandLine "${System.getProperty('java.home')}/bin/java",
                    "-cp", outputDir,
                    "com.kodu16.vsie.integration.deepspace.DeepSpaceHudMathContract"
        }
    }
}
