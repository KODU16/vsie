// Guards control-seat continuity while Sable recreates a ship across dimensions.
var verifyControlSeatDimensionTransfer = tasks.register("verifyControlSeatDimensionTransfer") {
    group = "verification"
    description = "Checks persisted controls, transfer-aware seat rebinding, and locked-view recentering."

    doLast {
        var seat = file("src/main/java/com/kodu16/vsie/content/controlseat/block/ControlSeatBlockEntity.java").text
        var seatBase = file("src/main/java/com/kodu16/vsie/content/controlseat/AbstractControlSeatBlockEntity.java").text
        var seatRegistry = file("src/main/java/com/kodu16/vsie/content/controlseat/server/SeatRegistry.java").text
        var serverData = file("src/main/java/com/kodu16/vsie/content/controlseat/server/ControlSeatServerData.java").text
        var warpUtils = file("src/main/java/com/kodu16/vsie/content/controlseat/server/WarpUtils.java").text
        var relativeLinkNbt = file("src/main/java/com/kodu16/vsie/foundation/RelativeBlockPosNbt.java").text
        var clientData = file("src/main/java/com/kodu16/vsie/content/controlseat/client/ControlSeatClientData.java").text
        var mouse = file("src/main/java/com/kodu16/vsie/content/controlseat/client/Input/ClientMouseHandler.java").text
        var sableTickBody = seat.substring(
                seat.indexOf('public void sable$tick(ServerSubLevel subLevel)'),
                seat.indexOf('public void sable$physicsTick(ServerSubLevel subLevel'))
        var linkedPeripheralSources = [
                "content/thruster/AbstractThrusterBlockEntity.java",
                "content/weapon/AbstractWeaponBlockEntity.java",
                "content/turret/AbstractTurretBlockEntity.java",
                "content/screen/AbstractScreenBlockEntity.java",
                "content/storage/ammobox/AmmoBoxBlockEntity.java",
                "content/storage/energybattery/AbstractEnergyBatteryBlockEntity.java",
                "content/storage/fueltank/AbstractFuelTankBlockEntity.java",
                "content/shield/ShieldGeneratorBlockEntity.java",
                "content/misc/electromagnet_rail/structure/core/ElectroMagnetRailCoreBlockEntity.java"
        ].collect { file("src/main/java/com/kodu16/vsie/${it}").text }
        if (!seat.contains('tag.putInt("Throttle"')
                || !seat.contains('tag.putBoolean("WasSeatOccupied"')
                || !seat.contains('WARP_FRAME_DIMENSION_TAG')
                || !seat.contains('reconcileWarpFrameAfterDimensionChange()')
                || !seat.contains('phase=TRANSIENT_STATE_CANCELLED')
                || !serverData.contains('cancelWarpExecutionForDimensionChange()')
                || !warpUtils.contains('phase=TELEPORT_SCHEDULED')
                || !warpUtils.contains('phase=TELEPORT_EXECUTED')
                || !seat.contains("isAwaitingOccupantRestore()")
                || !seatBase.contains('LINKED_PERIPHERAL_POSITION_FORMAT_TAG')
                || !seatBase.contains('normalizeLoadedLinkedOffset(')
                || !seatBase.contains('nbt.putBoolean(LINKED_PERIPHERAL_POSITION_FORMAT_TAG, true)')
                || !seatBase.contains('shouldRemoveMissingLinkedPeripheral(')
                || !seatBase.contains('LINK_TRACE_PREFIX')
                || !seatBase.contains('READ_SKIPPED_PARTIAL')
                || !seatBase.contains('MISSING_DELETE')
                || !seatBase.contains('MISSING_RECOVERED')
                || !seatBase.contains('phase=RESOLUTION_SNAPSHOT')
                || seat.count('traceLinkedPeripheralResolutionIfChanged();') < 2
                || sableTickBody.contains('tick();')
                || seat.contains('lastServerControlGameTime')
                || !seatRegistry.contains('REGISTRY_DIMENSION_HANDOFF')
                || !seatRegistry.contains('SUBLEVEL_TO_CONTROL_SEAT.get(subLevelId)')
                || !seatRegistry.contains('sameHostDimension && isControlSeatStillPresent')
                || !seatRegistry.contains('unregisterControlSeat(owner)')
                || seatRegistry.contains('unregisterControlSeat(level, owner.pos())')
                || !relativeLinkNbt.contains('targetPos.subtract(ownerPos)')
                || linkedPeripheralSources.any { !it.contains('RelativeBlockPosNbt.write(')
                        || !it.contains('RelativeBlockPosNbt.read(') }
                || !clientData.contains("observeDimension(")
                || !clientData.contains("consumePendingViewRecentering()")
                || !mouse.contains("centerLockedView(")) {
            throw new GradleException("Control-seat state and locked view must survive a Sable dimension transfer")
        }
    }
}

// Guards both electromagnetic-rail links against plot relocation, dimension transfer, and NBT recreation.
var verifyElectromagneticRailBindings = tasks.register("verifyElectromagneticRailBindings") {
    group = "verification"
    description = "Checks stable rail-core identity and same-sublevel control-seat recovery."

    doLast {
        var accelerator = file("src/main/java/com/kodu16/vsie/content/weapon/electro_magnet_rail_accelerator/ElectromagnetRailAcceleratorBlockEntity.java").text
        var core = file("src/main/java/com/kodu16/vsie/content/misc/electromagnet_rail/structure/core/ElectroMagnetRailCoreBlockEntity.java").text
        var linker = file("src/main/java/com/kodu16/vsie/content/item/linker/linker.java").text
        var linkRenderer = file("src/main/java/com/kodu16/vsie/content/weapon/missile_launcher/client/VerticleLaunchingSlotLinkRenderer.java").text
        var registryFile = file("src/main/java/com/kodu16/vsie/content/misc/electromagnet_rail/RailCoreRegistry.java")
        var seatRegistry = file("src/main/java/com/kodu16/vsie/content/controlseat/server/SeatRegistry.java").text

        if (!registryFile.exists()
                || !accelerator.contains("LINKED_CORE_BINDING_ID_TAG")
                || !accelerator.contains("RailCoreRegistry.resolve(")
                || !accelerator.contains("RailCoreRegistry.resolveNearest(")
                || !accelerator.contains("tag.putUUID(LINKED_CORE_BINDING_ID_TAG")
                || !accelerator.contains("retain unresolved legacy data")
                || !core.contains("getOrCreateRailBindingId(")
                || !core.contains("the linker overlay needs the new binding identity")
                || !core.contains("SeatRegistry.resolveControlSeat(")
                || !linker.contains("accelerator.bindToCore(core)")
                || !seatRegistry.contains("resolveControlSeat(ServerSubLevel")
                || !seatRegistry.contains("ownerSubLevel == null")
                || !registryFile.text.contains("CoreKey(ResourceKey<Level> dimension")
                || !registryFile.text.contains("server.getLevel(key.dimension())")
                || !accelerator.contains("registerClientAccelerator(this)")
                || !registryFile.text.contains("getClientAccelerators(UUID bindingId, Level level)")
                || !linkRenderer.contains("RAIL_LINK_STYLE")
                || !linkRenderer.contains("renderRailCoreLinks(")
                || !linkRenderer.contains("renderWorldLine(")) {
            throw new GradleException("Electromagnetic rail bindings must survive independent sublevel migration")
        }
    }
}

// Ensures locked control-seat input never consumes mouse events intended for an open GUI.
var verifyControlSeatScreenInput = tasks.register("verifyControlSeatScreenInput") {
    group = "verification"
    description = "Checks that control-seat mouse capture yields to every open screen."

    doLast {
        var mouseMixin = file("src/main/java/com/kodu16/vsie/mixin/MouseInputMixin.java").text
        if (!mouseMixin.contains("shouldYieldToOpenScreen()")
                || mouseMixin.count("if (shouldYieldToOpenScreen())") < 3
                || !mouseMixin.contains("phase=YIELD_TO_SCREEN")
                || !mouseMixin.contains("input=SCROLL")) {
            throw new GradleException("VSIE control-seat mouse capture must yield movement, buttons, and scroll to open screens")
        }
    }
}

tasks.named("check") {
    dependsOn verifyControlSeatDimensionTransfer
    dependsOn verifyElectromagneticRailBindings
    dependsOn verifyControlSeatScreenInput
}

// Guards code-rendered screens against applying Minecraft's world blur to already drawn GUI pixels.
var verifyCrispGuiRendering = tasks.register("verifyCrispGuiRendering") {
    group = "verification"
    description = "Checks crisp base screens and prevents duplicate container background passes."

    doLast {
        var crisp = file("src/main/java/com/kodu16/vsie/foundation/client/CrispScreen.java")
        if (!crisp.exists()
                || !crisp.text.contains("renderTransparentBackground(graphics)")
                || crisp.text.contains(".processBlurEffect(")) {
            throw new GradleException("Code-rendered AeroIE screens must bypass the world blur shader")
        }

        var independentScreens = [
                "src/main/java/com/kodu16/vsie/content/aeroie_custom/client/CustomDeviceEditorScreen.java",
                "src/main/java/com/kodu16/vsie/content/aeroie_custom/client/CustomDeviceAssetPackageScreen.java",
                "src/main/java/com/kodu16/vsie/content/aeroie_custom/client/CustomDeviceDefinitionSaveScreen.java",
                "src/main/java/com/kodu16/vsie/content/aeroie_custom/client/CustomDeviceSelectorScreen.java",
                "src/main/java/com/kodu16/vsie/content/aeroie_custom/export/client/RegionObjExportScreen.java",
                "src/main/java/com/kodu16/vsie/content/controlseat/client/ControlSeatWarpSelectionScreen.java"
        ]
        if (independentScreens.any { !file(it).text.contains("extends CrispScreen") }) {
            throw new GradleException("Every independent AeroIE GUI must use CrispScreen")
        }

        var duplicateContainerBackground = fileTree("src/main/java") {
            include "**/*Screen.java"
        }.files.find { source ->
            source.text.contains("extends AbstractContainerScreen")
                    && source.text =~ /renderBackground\([^;]+;\s*super\.render\(/
        }
        if (duplicateContainerBackground != null) {
            throw new GradleException("Container GUI renders its background twice: ${duplicateContainerBackground}")
        }
    }
}

tasks.named("check") {
    dependsOn verifyCrispGuiRendering
}

